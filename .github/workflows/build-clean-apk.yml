name: Build Clean APK (No VPN)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Disable VPN Logic
        run: |
          sed -i 's/public static boolean EDITION_WITH_VPN = true;/public static boolean EDITION_WITH_VPN = false;/g' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Build and Sign APK
        run: ./gradlew assembleAfatRelease
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Telegram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
